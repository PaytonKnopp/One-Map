name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # Full history: the chronicle page (M4) is generated from git log.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Validate world data
        run: npm run validate

      - name: Build
        run: npm run build

  # Deploy job lands in M2 once the site has something worth deploying,
  # using actions/configure-pages, actions/upload-pages-artifact, and
  # actions/deploy-pages (see docs/DECISIONS.md).
