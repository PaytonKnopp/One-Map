<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    App icon (favicon / home-screen icon): a folded map with a "1" on it,
    on a light greyish-purple tile. PNG sizes are rendered from this file
    by `npm run app-icon`; #bg and #art are the hooks it uses for the
    full-bleed (apple-touch / maskable) variants.
  -->
  <defs>
    <linearGradient id="bg-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d3e6" />
      <stop offset="1" stop-color="#b9b0cf" />
    </linearGradient>
    <filter id="map-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <clipPath id="map-clip">
      <path d="M64 112 L192 88 L320 112 L448 88 L448 400 L320 424 L192 400 L64 424 Z" />
    </clipPath>
  </defs>

  <rect id="bg" width="512" height="512" rx="112" fill="url(#bg-fill)" />

  <g id="art">
    <!-- soft drop shadow under the map -->
    <path
      d="M64 112 L192 88 L320 112 L448 88 L448 400 L320 424 L192 400 L64 424 Z"
      transform="translate(0 14)"
      fill="#4e4470"
      opacity="0.35"
      filter="url(#map-shadow)"
    />

    <g clip-path="url(#map-clip)">
      <!-- paper -->
      <rect x="64" y="88" width="384" height="336" fill="#fbf6e9" />

      <!-- sea in the lower-left, lake in the upper-right -->
      <path
        d="M64 300 C 98 296 120 318 142 344 C 160 366 186 378 214 392 C 222 404 224 416 226 430 L64 430 Z"
        fill="#a7cbdb"
      />
      <path
        d="M64 312 C 92 310 110 328 128 350 C 146 372 170 386 196 400"
        fill="none"
        stroke="#7fb0c6"
        stroke-width="3"
        opacity="0.7"
      />
      <ellipse cx="392" cy="158" rx="30" ry="18" fill="#a7cbdb" />

      <!-- forests -->
      <g fill="#93b384">
        <path d="M100 150 l12 22 h-24 Z" />
        <path d="M122 140 l12 22 h-24 Z" />
        <path d="M118 170 l12 22 h-24 Z" />
        <path d="M372 330 l12 22 h-24 Z" />
        <path d="M394 318 l12 22 h-24 Z" />
        <path d="M398 346 l12 22 h-24 Z" />
      </g>

      <!-- dotted route ending at an X -->
      <path
        d="M106 270 C 150 236 168 214 200 210 M316 300 C 350 290 360 250 382 228"
        fill="none"
        stroke="#c4574f"
        stroke-width="7"
        stroke-linecap="round"
        stroke-dasharray="1 15"
      />
      <path
        d="M378 206 l22 22 M400 206 l-22 22"
        stroke="#c4574f"
        stroke-width="8"
        stroke-linecap="round"
      />

      <!-- fold shading: middle panel faces away from the light -->
      <path d="M192 88 L320 112 L320 424 L192 400 Z" fill="#6b5a2e" opacity="0.1" />
      <path d="M192 88 L192 400 M320 112 L320 424" stroke="#6b5a2e" stroke-width="2" opacity="0.18" />
    </g>

    <!-- the "1" -->
    <path
      d="M240 152 L294 152 L294 318 L326 318 L326 358 L194 358 L194 318 L234 318 L234 214 L198 230 L198 188 Z"
      fill="#4a3d72"
      stroke="#fbf6e9"
      stroke-width="14"
      stroke-linejoin="round"
      paint-order="stroke"
    />
  </g>
</svg>
